<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Launch – FC Training Path</title>
<style>
:root{
  --bg:#060A1C; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.09); --line:rgba(255,255,255,.12);
  --ink:#EEF2FF; --muted:#9AA6C8; --orange:#E07300; --orange2:#FFB061; --pink:#FF5FC8; --navy:#134564; --cyan:#4CC9F0;
  --green:#3DDC84; --red:#FF5A6E; --r:16px; --glow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(255,95,200,.16),transparent 60%),
             radial-gradient(900px 600px at -10% 30%,rgba(23,102,155,.35),transparent 60%),
             radial-gradient(800px 500px at 60% 110%,rgba(224,115,0,.14),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.top,.wrap{position:relative;z-index:1}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 28px;background:rgba(6,10,28,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;white-space:nowrap}
.logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--orange),#FF8A3D);display:grid;place-items:center;box-shadow:0 0 18px rgba(224,115,0,.55)}
.logo .name b{display:block;font-size:19px;letter-spacing:.22em;font-weight:900}
.logo .name span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:-2px}
.search{flex:1;max-width:400px;margin-left:auto}
.search input{width:100%;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font:inherit;background:rgba(255,255,255,.06);color:var(--ink);outline:none}
.search input:focus{border-color:var(--cyan)}
.search input::placeholder{color:var(--muted)}
.xp-pill{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;white-space:nowrap;font-size:14px}
.xp-pill b{color:var(--orange2)}
.user{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.user:after{content:"";position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
/* hero */
.hero{position:relative;border-radius:24px;padding:40px 40px;min-height:380px;display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:center;overflow:hidden;
  background:linear-gradient(120deg,rgba(19,69,100,.95),rgba(23,102,155,.75) 55%,rgba(107,47,140,.55));box-shadow:var(--glow)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff6,transparent),radial-gradient(1.5px 1.5px at 65% 20%,#fff7,transparent),radial-gradient(2px 2px at 85% 80%,#fff6,transparent),radial-gradient(1px 1px at 10% 85%,#fff8,transparent),radial-gradient(1px 1px at 55% 45%,#fff6,transparent);pointer-events:none}
.hero .moon{position:absolute;right:-90px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,95,200,.45),rgba(255,95,200,.08) 55%,transparent 70%);pointer-events:none}
.hero .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange2);font-weight:800}
.hero h1{margin:8px 0 10px;font-size:34px;line-height:1.15}
.hero p{margin:0;color:#D6DEF5;max-width:560px;font-size:16px}
.hero .stats{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
.stat{background:rgba(6,10,28,.35);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:150px}
.stat b{display:block;font-size:26px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.frannie-zone{position:relative;height:340px;display:grid;place-items:center}
.frannie{position:relative;width:270px;animation:float 6.5s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,95,200,.45))}
.frannie-inner{position:relative;animation:sway 9s ease-in-out infinite;transform-origin:50% 40%}
.frannie img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.lid{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#FF9BDF,#F57ED2 70%);transform-origin:50% 0;transform:rotate(14deg) scaleY(0);animation:blink 5s infinite}
.lid.l{left:58.3%;top:24.1%;width:5.4%;height:5%}
.lid.r{left:71.7%;top:27.4%;width:6.8%;height:5.4%}
@keyframes float{0%,100%{transform:translate(0,0)}25%{transform:translate(6px,-14px)}50%{transform:translate(-4px,-22px)}75%{transform:translate(-8px,-8px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,91%,100%{transform:rotate(14deg) scaleY(0)}94%,95.5%{transform:rotate(14deg) scaleY(1)}}
.rank-tag{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:20px;background:rgba(6,10,28,.6);border:1px solid rgba(255,95,200,.45);font-size:13px;white-space:nowrap;backdrop-filter:blur(6px);perspective:400px}
.rank-tag .lv{width:22px;height:22px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff}
.rank-tag b{letter-spacing:.08em;text-transform:uppercase}
.rank-tag span{color:var(--muted)}
.rank-tag.flip{animation:flip .8s}
@keyframes flip{0%{transform:translateX(-50%) rotateX(0)}50%{transform:translateX(-50%) rotateX(90deg)}100%{transform:translateX(-50%) rotateX(0)}}
/* rocket bar */
.launchbar{margin:22px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 18px;overflow:hidden}
.launchbar .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.launchbar .cap b{color:var(--ink)}
.track{position:relative;height:44px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  background-image:radial-gradient(1px 1px at 10% 40%,#fff6,transparent),radial-gradient(1px 1px at 30% 70%,#fff5,transparent),radial-gradient(1px 1px at 55% 30%,#fff6,transparent),radial-gradient(1px 1px at 75% 65%,#fff5,transparent),radial-gradient(1px 1px at 92% 35%,#fff6,transparent)}
.tick{position:absolute;top:8px;bottom:8px;width:2px;border-radius:2px;background:rgba(255,255,255,.18)}
.tick.hit{background:var(--orange2);box-shadow:0 0 8px var(--orange)}
.flame{position:absolute;left:4px;top:8px;bottom:8px;width:0;border-radius:16px;overflow:hidden;transition:width 2.4s cubic-bezier(.25,.8,.25,1)}
.flame:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(224,115,0,0) 0%,rgba(224,115,0,.45) 35%,#FF7A00 70%,#FFC15A 90%,#FFF4D6 100%)}
.flame:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 18px,rgba(255,230,160,.25) 18px 26px);animation:flick .6s linear infinite;mix-blend-mode:screen}
@keyframes flick{to{background-position:52px 0}}
.rocket{position:absolute;top:50%;left:0;width:64px;height:32px;margin:-16px 0 0 -18px;transition:left 2.4s cubic-bezier(.25,.8,.25,1);z-index:2;animation:rumble .18s infinite;filter:drop-shadow(0 0 10px rgba(255,160,60,.6))}
@keyframes rumble{0%,100%{transform:translate(0,0)}50%{transform:translate(.6px,-.8px)}}
.puff{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,rgba(230,232,245,.55),rgba(200,205,225,0) 70%);pointer-events:none;animation:puff 1.7s ease-out forwards;z-index:1}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.85}100%{transform:translate(var(--dx),var(--dy)) scale(2.6);opacity:0}}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{margin:0 0 12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.12em}
.continue{display:flex;gap:18px;align-items:center;margin-top:16px}
.continue .t{flex:1;min-width:0}
.continue .t b{display:block;font-size:17px}
.continue .t span{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:linear-gradient(135deg,var(--orange),#FF8A3D);color:#fff;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(224,115,0,.55)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--panel2);box-shadow:none}
.btn.blue{background:linear-gradient(135deg,#17669B,#2A9FD6)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.bar{height:7px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;margin:34px 0 16px;gap:12px;flex-wrap:wrap}
.section-h h2{margin:0;font-size:22px}
.section-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
/* planets */
.planet{position:relative;border-radius:50%;flex:none}
.planet .pb,.planet .pf{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 28%),repeating-linear-gradient(-18deg,rgba(255,255,255,0) 0 14%,rgba(0,0,0,.12) 14% 20%),radial-gradient(circle at 40% 40%,var(--c),color-mix(in srgb,var(--c) 40%,#050816) 78%)}
.planet .pb{filter:grayscale(.85) brightness(1.15);opacity:.4}
.planet .pf{clip-path:inset(100% 0 0 0);transition:clip-path 1.6s cubic-bezier(.2,.8,.2,1)}
.planet .atm{position:absolute;inset:-6%;border-radius:50%;box-shadow:0 0 calc(var(--s)*.25) color-mix(in srgb,var(--c) 70%,transparent);opacity:var(--o,.2);transition:opacity 1.2s}
.planet .ringp{position:absolute;left:-28%;right:-28%;top:42%;height:18%;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,#fff);opacity:.55;transform:rotate(-16deg);pointer-events:none}
.galaxy{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .6s both;overflow:hidden}
.pcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--c) 35%,transparent)}
.pcard .head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.pcard .num{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:800}
.pcard h4{margin:2px 0 0;font-size:17px}
.pcard .sub{color:var(--muted);font-size:13px;margin:0 0 14px;min-height:38px}
.pcard .stone{position:absolute;top:14px;right:14px}
.pcard .status{color:#C9D2EE}
.pcard .head > div:last-child{padding-right:30px}
.pcard.home .status{color:var(--orange2)}
.mini{display:grid;gap:8px}
.mini .row{display:grid;grid-template-columns:62px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mini .row b{color:var(--ink);text-align:right}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* planet page */
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb a{cursor:pointer;font-weight:700;color:var(--cyan)}
.phead{position:relative;border-radius:24px;padding:28px 32px;display:flex;gap:28px;align-items:center;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,#0A0F2A),rgba(10,15,42,.85));border:1px solid var(--line)}
.phead .num{font-size:12px;letter-spacing:.2em;color:var(--orange2);font-weight:800}
.phead h1{margin:4px 0 4px;font-size:30px}
.phead p{margin:0;color:#C9D2EE}
.phead .right{margin-left:auto;display:flex;gap:18px;align-items:center}
.pstat{text-align:center;min-width:90px}
.pstat b{display:block;font-size:24px}
.pstat span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin:20px 0 18px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:14px;width:max-content;max-width:100%}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab.on{background:linear-gradient(135deg,var(--orange),#FF8A3D);color:#fff}
.tab .cnt{font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px;align-items:center}
.own{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.own .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.own.customer{background:rgba(224,115,0,.18);color:#FFB061}
.own.fc{background:rgba(76,201,240,.15);color:#7FD8F7}
.own.shared{background:rgba(155,93,229,.22);color:#C9A6FF}
.own.help{background:rgba(255,90,110,.18);color:#FF8C9A}
.own.done{background:rgba(61,220,132,.15);color:#6FE7A5}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.phase-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.phase-h .n{width:30px;height:30px;border-radius:50%;background:rgba(76,201,240,.15);color:#7FD8F7;display:grid;place-items:center;font-weight:800;font-size:13px}
.phase-h.complete .n{background:var(--green);color:#06301A}
.phase-h b{flex:1}
.phase-h span{font-size:12px;color:var(--muted)}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:background .15s;position:relative}
.task:last-child{border-bottom:0}
.task:hover{background:rgba(255,255,255,.04)}
.task.next{background:linear-gradient(90deg,rgba(224,115,0,.16),transparent 70%)}
.task.next:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);box-shadow:0 0 10px var(--orange)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;transition:all .25s}
.check:hover{border-color:var(--green)}
.task.done .check{background:var(--green);border-color:var(--green);animation:pop .35s}
.task.done .ttl{color:var(--muted);text-decoration:line-through}
@keyframes pop{50%{transform:scale(1.25)}}
.ttl{font-weight:700}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;align-items:center;font-size:12px;color:var(--muted)}
.flag{display:flex;gap:7px;align-items:flex-start;margin-top:7px;font-size:12px;color:#FFB3BD;background:rgba(255,90,110,.12);border:1px solid rgba(255,90,110,.25);border-radius:9px;padding:6px 10px}
.nextlbl{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--orange2);text-transform:uppercase}
.right-meta{font-size:12px;color:var(--muted);text-align:right}
.right-meta em{font-style:normal;color:#7FD8F7}
.side .card{margin-bottom:16px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
/* trail */
.trail-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 26px;overflow:hidden}
.trail-wrap svg{display:block;width:100%;height:auto}
.trail-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12;stroke-linecap:round}
.trail-done{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.trail-dash{fill:none;stroke:rgba(255,255,255,.7);stroke-width:2;stroke-dasharray:1 12;stroke-linecap:round}
.node{cursor:pointer}
.node .disc{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.node:hover .disc{transform:scale(1.08)}
.node.current .halo{animation:halo 1.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.node text,.band{paint-order:stroke;stroke:#0E1433;stroke-width:5px;stroke-linejoin:round}
.band{font-size:11px;font-weight:900;letter-spacing:.16em}
.terra{display:grid;place-items:center;padding:8px 0 4px}
.terra .pct{font-size:28px;font-weight:800;margin-top:12px}
.terra small{color:var(--muted)}
.stonebox{display:flex;gap:14px;align-items:center}
.stonebox .txt{font-size:13px;color:var(--muted)}
.stonebox .txt b{display:block;color:var(--ink);font-size:15px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(2,4,14,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#0B1030;border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.dh{padding:22px 22px 18px;position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#0B1030),#0B1030)}
.dh .x{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.12);border:0;width:32px;height:32px;border-radius:50%;font-size:18px}
.dh small{color:var(--orange2);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}
.dh h2{margin:6px 0 0;font-size:21px;padding-right:30px}
.db{padding:18px 22px;overflow:auto;flex:1}
.db h5{margin:20px 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resp .box{border-radius:12px;padding:12px;font-size:12px;border:1px solid var(--line)}
.resp .box b{display:block;font-size:14px;margin-top:3px}
.resp .box.c{background:rgba(224,115,0,.12);color:#FFB061}.resp .box.c b{color:var(--ink)}
.resp .box.f{background:rgba(76,201,240,.1);color:#7FD8F7}.resp .box.f b{color:var(--ink)}
.resp .box.muted{opacity:.4}
.train{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.03)}
.train .ty{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:10px;font-weight:900;color:#fff}
.ty.video{background:#C2334A}.ty.article{background:#17669B}.ty.live{background:#7A47C2}.ty.quiz{background:#23985A}.ty.scorm{background:#C77700}
.train .tt{flex:1;font-size:12px;color:var(--muted)}
.train .tt b{display:block;font-size:14px;color:var(--ink)}
.train.seen{border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.08)}
.nexts .n{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14px}
.nexts .n:hover b{color:var(--orange2)}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.df .btn{flex:1}
/* toast / confetti / modal */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);background:#111A44;border:1px solid var(--line);padding:12px 18px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:70;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.toast .xp{background:var(--orange);border-radius:8px;padding:3px 8px;font-weight:900;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:75;background:rgba(2,4,14,.7);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{width:min(440px,92vw);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c,#E07300) 30%,#0B1030),#0B1030 70%);border:1px solid var(--line);border-radius:24px;padding:30px 28px 26px;text-align:center;transform:scale(.7);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.modal.on .mbox{transform:none}
.mbox .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange2);font-weight:900}
.mbox h2{margin:8px 0 8px;font-size:24px}
.mbox p{color:#C9D2EE;margin:0 0 18px;font-size:14px}
.stage{position:relative;width:200px;height:200px;margin:0 auto 14px}
.stage > *{position:absolute;inset:0;margin:auto}
.stage .rays{width:260px;height:260px;left:-30px;top:-30px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 60%,transparent) 0 8deg,transparent 8deg 24deg);mask:radial-gradient(circle,#000 20%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);opacity:0;transform:scale(.3)}
.stage .gem{opacity:0;transform:scale(.2) rotate(-20deg)}
.stage .gem{display:grid;place-items:center}
.stage .half{position:absolute;inset:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.stage .half.l{clip-path:polygon(0 0,52% 0,44% 30%,56% 52%,46% 75%,52% 100%,0 100%)}
.stage .half.r{clip-path:polygon(52% 0,100% 0,100% 100%,52% 100%,46% 75%,56% 52%,44% 30%)}
.stage .cracks{opacity:0}
.stage.shake .rockwrap{animation:shake .12s infinite}
.stage.crack .cracks{opacity:1;transition:opacity .3s}
.stage.split .half.l{transform:translate(-90px,40px) rotate(-35deg);opacity:0}
.stage.split .half.r{transform:translate(90px,40px) rotate(35deg);opacity:0}
.stage.split .cracks{opacity:0}
.stage.split .gem{opacity:1;transform:none;transition:all .8s cubic-bezier(.2,1.5,.4,1) .15s}
.stage.split .rays{opacity:1;transform:scale(1);transition:all 1s ease .2s;animation:spin 12s linear infinite}
.stage .rockwrap{position:absolute;inset:0}
.stage.found .rockwrap{animation:drop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{0%{transform:translate(2px,0) rotate(1deg)}50%{transform:translate(-2px,1px) rotate(-1deg)}100%{transform:translate(1px,-1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{from{transform:translateY(-120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.mbox .sparkle{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:tw 1.4s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.hidden{display:none!important}
@media (max-width:920px){
  .hero{grid-template-columns:1fr;padding:30px 26px}
  .frannie-zone{height:300px}
  .layout{grid-template-columns:1fr}
  .search{display:none}
  .phead{flex-wrap:wrap}
  .phead .right{margin-left:0}
}
@media (max-width:560px){
  .wrap{padding:16px 16px 50px}
  .top{padding:10px 16px}
  .logo .name span{display:none}
  .hero h1{font-size:26px}
  .stat{min-width:0;flex:1}
  .task{grid-template-columns:30px 1fr}
  .task .right-meta{display:none}
  .resp{grid-template-columns:1fr}
  .continue{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

PRODUCTS.forEach(p=>{p.phases=p.phases.map((tasks,i)=>({name:PH[i],tasks})).filter(ph=>ph.tasks.length);p.missions=[...p.basic,...p.inter,'Conquer the Territory'];});
const RANKS=[{n:'Cadet',xp:0},{n:'Explorer',xp:300},{n:'Pilot',xp:900},{n:'Commander',xp:1800},{n:'Galactic Ranger',xp:3200}];
const OWN={customer:'Your crew',fc:'FC Mission Control',shared:'Joint mission'};
const XP={task:50,training:10,mission:100,stone:150,conquer:300};

/* ================= STATE (in memory, seeded demo) ================= */
const S={xp:0,done:new Set(),seen:new Set(),help:new Set(),m:{},view:'home',pid:null,tab:'setup'};
PRODUCTS.forEach(p=>S.m[p.id]=0);
['f1','f2','f3'].forEach(id=>S.done.add(id));
S.m.found=5; S.help.add('f4');
S.xp=3*XP.task+5*XP.mission+XP.stone;

const P=id=>PRODUCTS.find(p=>p.id===id);
const allTasks=p=>p.phases.flatMap(ph=>ph.tasks);
const findTask=id=>{for(const p of PRODUCTS)for(const t of allTasks(p))if(t.id===id)return{p,t};};
const setupPct=p=>{const a=allTasks(p);return Math.round(a.filter(t=>S.done.has(t.id)).length/a.length*100)};
const missionPct=p=>Math.round(S.m[p.id]/p.missions.length*100);
const stoneState=p=>S.m[p.id]>=p.missions.length?'gem':S.m[p.id]>=p.basic.length?'rock':'none';
const rankOf=xp=>{let i=0;RANKS.forEach((r,k)=>{if(xp>=r.xp)i=k});return i};
const nextTask=p=>allTasks(p).find(t=>!S.done.has(t.id));
const ownChip=o=>`<span class="own ${o}"><span class="d"></span>${OWN[o]}</span>`;
const pad=n=>String(n).padStart(2,'0');

}
let gid=0;
const shade=(h,k)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*k).toString(16).padStart(2,'0')).join('');
function rockSVG(s){const id='rk'+(gid++);return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#A89580"/><stop offset=".6" stop-color="#6E5E4E"/><stop offset="1" stop-color="#3E342B"/></radialGradient></defs>

  <circle cx="36" cy="56" r="3" fill="#00000030"/><circle cx="70" cy="40" r="2.5" fill="#00000030"/><circle cx="58" cy="74" r="2" fill="#00000030"/><path d="M28 40 L40 30" stroke="#ffffff40" stroke-width="3" stroke-linecap="round"/></svg>`;}
function gemSVG(color,s){const id='gm'+(gid++);return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${color}"/><stop offset="1" stop-color="${shade(color,.45)}"/></linearGradient></defs>
  <g style="filter:drop-shadow(0 0 8px ${color})"><polygon points="28,22 72,22 90,42 50,90 10,42" fill="url(#${id})" stroke="#ffffffaa" stroke-width="1.5"/>
  <polygon points="28,22 40,42 60,42 72,22" fill="#ffffff55"/><polygon points="10,42 40,42 50,90" fill="#00000022"/><polygon points="90,42 60,42 50,90" fill="#ffffff22"/>
  <path d="M10 42 H90 M40 42 L50 22 L60 42 M40 42 L50 90 L60 42" stroke="#ffffff88" stroke-width="1" fill="none"/><circle cx="34" cy="30" r="3" fill="#fff"/></g></svg>`;}
function emptyStone(s){return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3" stroke-dasharray="6 7"/><text x="50" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="rgba(255,255,255,.3)">?</text></svg>`;}
const stoneIcon=(p,s)=>{const st=stoneState(p);return st==='gem'?gemSVG(p.g,s):st==='rock'?rockSVG(s):emptyStone(s)};

/* ================= HOME ================= */

  return `

    </div>

      <div class="rank-tag" id="rankTag"><span class="lv">${ri+1}</span><b>${r.n}</b><span>· ${S.xp.toLocaleString()} XP</span></div>
    </div>
  </section>

  <section class="launchbar">
    <div class="cap"><span>Altitude <b>${S.xp.toLocaleString()} XP</b></span><span>${nxt?`Next orbit in <b>${(nxt.xp-S.xp).toLocaleString()} XP</b>`:'<b>Max orbit reached</b>'}</span></div>
    <div class="track" id="track">
      ${RANKS.slice(1).map(k=>`<i class="tick ${S.xp>=k.xp?'hit':''}" style="left:${k.xp/maxXP*100}%"></i>`).join('')}
      <div class="flame" id="flame" data-w="${pct}"></div>
      <div class="rocket" id="rocket" data-l="${pct}"><svg width="64" height="32" viewBox="0 0 64 32"><path d="M14 10 L5 1 L24 9Z" fill="#E07300"/><path d="M14 22 L5 31 L24 23Z" fill="#E07300"/><path d="M8 16 C16 5 42 4 60 16 C42 28 16 27 8 16Z" fill="#F4F6FB"/><path d="M47 8.5 C53 10.5 57.5 13 60 16 C57.5 19 53 21.5 47 23.5 Z" fill="#E07300"/><circle cx="35" cy="16" r="5.2" fill="#17669B" stroke="#fff" stroke-width="2"/><circle cx="33.5" cy="14.5" r="1.5" fill="#BFE6FF"/><path d="M8 16 L3 13 L3 19Z" fill="#9AA6C8"/></svg></div>
    </div>
  </section>

  <section class="card" style="margin-top:16px">
    <h3>${svg('radio','#FFB061',16)} Continue where you left off</h3>

        <div class="bar" style="margin-top:10px;max-width:420px"><i style="background:${cont.c}" data-w="${setupPct(cont)}"></i></div></div>
      <button class="btn" onclick="go('path','${cont.id}')">Resume mission</button>
    </div>

  <div class="section-h"><div><h2>Galaxy map</h2><p>Recommended flight order — every planet has a Launch Checklist and a Mission Path.</p></div></div>

}
function pcard(p,i){
  const sp=setupPct(p),mp=missionPct(p),st=stoneState(p);
  const status=i===0&&sp<100?'Start here':st==='gem'?'Conquered':sp===100?'In orbit':sp>0||mp>0?'In flight':'Unexplored';
  return `<div class="pcard ${i===0?'home':''}" style="--c:${p.c};animation-delay:${i*55}ms" onclick="go('path','${p.id}')">
    <div class="stone">${stoneIcon(p,34)}</div>
    <div class="head">${planet(p,68,mp)}<div><div class="num">PLANET ${pad(i+1)} · <span class="status">${status}</span></div><h4>${p.name}</h4></div></div>

      <div class="row">Launch<div class="bar"><i style="background:${p.c}" data-w="${sp}"></i></div><b>${sp}%</b></div>
      <div class="row">Missions<div class="bar"><i style="background:linear-gradient(90deg,#E07300,#FFB061)" data-w="${mp}"></i></div><b>${mp}%</b></div>
    </div></div>`;
}

/* ================= PLANET PAGE ================= */
function path(){
  const p=P(S.pid),i=PRODUCTS.indexOf(p),a=allTasks(p);
  return `
  <div class="crumb"><a onclick="go('home')">← Galaxy map</a> / Planet ${pad(i+1)}</div>

  </section>
  <div class="tabs">
    <button class="tab ${S.tab==='setup'?'on':''}" onclick="S.tab='setup';render()">${svg('list','currentColor',16)} Launch checklist <span class="cnt">${a.filter(t=>S.done.has(t.id)).length}/${a.length}</span></button>
    <button class="tab ${S.tab==='career'?'on':''}" onclick="S.tab='career';render()">${svg('orbit','currentColor',16)} Mission path <span class="cnt">${S.m[p.id]}/${p.missions.length}</span></button>

function setupView(p){
  const a=allTasks(p),nt=nextTask(p);
  const crew=a.filter(t=>!S.done.has(t.id)&&t.owner!=='fc').length;
  const mc=a.filter(t=>!S.done.has(t.id)&&t.owner!=='customer').length;
  const helps=a.filter(t=>S.help.has(t.id)&&!S.done.has(t.id));
  return `<div class="legend"><b style="color:var(--ink)">Who flies it:</b> ${ownChip('customer')} ${ownChip('fc')} ${ownChip('shared')} <span class="own help"><span class="d"></span>Mission Control assisting</span></div>
  <div class="layout"><div>
  ${p.phases.map((ph,i)=>{const d=ph.tasks.filter(t=>S.done.has(t.id)).length,c=d===ph.tasks.length;
    return `<div class="phase"><div class="phase-h ${c?'complete':''}"><div class="n">${c?svg('check','#06301A',14,3):i+1}</div><b>${ph.name}</b><span>${d}/${ph.tasks.length} complete</span></div>${ph.tasks.map(t=>taskRow(t,nt)).join('')}</div>`}).join('')}
  </div>
  <div class="side">
    <div class="card"><h3>Flight status</h3>
      <div class="kv"><span>Waiting on your crew</span><b style="color:#FFB061">${crew}</b></div>
      <div class="kv"><span>FC Mission Control / joint</span><b style="color:#7FD8F7">${mc}</b></div>
      <div class="kv"><span>Assistance requested</span><b style="color:#FF8C9A">${helps.length}</b></div>
      <div class="kv"><span>Next maneuver ETA</span><b>${nt?nt.est:'—'}</b></div>
    </div>
    ${helps.length?`<div class="card" style="border-color:rgba(255,90,110,.4)"><h3 style="color:#FF8C9A">${svg('radio','#FF8C9A',16)} Mission Control assisting</h3>${helps.map(t=>`<div class="kv" style="cursor:pointer;display:block" onclick="openTask('${t.id}')"><b style="font-size:13px">${t.title}</b><div style="font-size:12px;color:var(--muted)">${t.fc||'FC Support'}</div></div>`).join('')}</div>`:''}
    <div class="card"><h3>Fuel rewards</h3><div style="font-size:13px;color:var(--muted)">+${XP.task} XP per launch task<br>+${XP.training} XP per flight training<br>+${XP.mission} XP per mission<br>+${XP.stone} XP Special Stone found<br>+${XP.conquer} XP Conquer the Territory</div></div>
  </div></div>`;
}
function taskRow(t,nt){
  const d=S.done.has(t.id),isN=nt&&nt.id===t.id,h=S.help.has(t.id)&&!d;
  return `<div class="task ${d?'done':''} ${isN?'next':''}" onclick="openTask('${t.id}')">
    <div class="check" role="checkbox" aria-checked="${d}" onclick="event.stopPropagation();toggleTask('${t.id}',this)">${d?svg('check','#06301A',14,3):''}</div>
    <div>${isN?'<div class="nextlbl">Next maneuver</div>':''}<div class="ttl">${t.title}</div>
      <div class="meta">${ownChip(t.owner)} ${h?'<span class="own help"><span class="d"></span>Mission Control assisting</span>':''}<span>ETA ${t.est}</span>${t.trainings.length?`<span>· ${t.trainings.length} flight training${t.trainings.length>1?'s':''}</span>`:''}</div>
      ${t.flag&&!d?`<div class="flag">${svg('alert','#FF8C9A',14)}<span>${t.flag}</span></div>`:''}
    </div>
    <div class="right-meta">${t.role||''}${t.fc?`<br><em>FC: ${t.fc}</em>`:''}</div>
  </div>`;
}
function careerView(p){
  const n=p.missions.length,W=640,gap=112,H=n*gap+50,done=S.m[p.id];
  const xs=[170,470,320,170,470];
  const pts=p.missions.map((_,i)=>({x:i===n-1?320:xs[i%5],y:70+i*gap}));
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<n;i++){const a=pts[i-1],b=pts[i];d+=` C ${a.x} ${a.y+gap*.6}, ${b.x} ${b.y-gap*.6}, ${b.x} ${b.y}`;}
  const frac=done===0?0:Math.min(1,done/(n-1));
  const bands={0:'BASIC ORBIT',5:'INTERMEDIATE ORBIT',10:'FINAL FRONTIER'};
  const nodes=p.missions.map((m,i)=>{
    const st=i<done?'done':i===done?'current':'locked',fin=i===n-1,pt=pts[i],R=fin?40:30;
    const fill=st==='done'?'#2BB673':st==='current'?'#E07300':'#2A3158';
    const icon=st==='done'?ICON.check:st==='locked'?ICON.lock:fin?ICON.flag:ICON.rocket;
    const band=bands[i]!==undefined?`<text class="band" x="${pt.x<320?W-24:24}" y="${pt.y-30}" text-anchor="${pt.x<320?'end':'start'}" fill="${p.c}">${bands[i]}</text>`:'';
    const stoneMark=i===4?`<g transform="translate(${pt.x+(pt.x<320?44:-80)},${pt.y-18})" opacity="${done>=5?1:.35}">${rockSVG(36).replace('<svg','<svg x="0" y="0"')}</g>`:'';
    return `${band}${stoneMark}<g class="node ${st}" onclick="openMission('${p.id}',${i})">
      ${st==='current'?`<circle class="halo" cx="${pt.x}" cy="${pt.y}" r="${R}" fill="#E07300" opacity=".5"/>`:''}
      <g class="disc"><circle cx="${pt.x}" cy="${pt.y}" r="${R}" fill="${fill}" stroke="${st==='locked'?'#3A4270':'#fff'}" stroke-width="4"/>
      <svg x="${pt.x-12}" y="${pt.y-12}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${st==='locked'?'#7C86B5':'#fff'}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></g>
      <text x="${pt.x}" y="${pt.y+R+20}" text-anchor="middle" font-size="14" font-weight="700" fill="${st==='locked'?'#7C86B5':'#EEF2FF'}">${m}</text>
      <text x="${pt.x}" y="${pt.y+R+37}" text-anchor="middle" font-size="12" fill="#9AA6C8">${fin?`+${XP.conquer} XP · reveal the stone`:`Mission ${pad(i+1)} · +${XP.mission} XP`}</text></g>`}).join('');
  const st=stoneState(p);
  const stoneTxt=st==='gem'?`<b>${p.gem}</b>Revealed! This planet is conquered.`:st==='rock'?`<b>Unidentified stone</b>Complete the Intermediate orbit and Conquer the Territory to discover what it really is.`:`<b>No stone yet</b>Complete the ${p.basic.length} Basic missions to find this planet's Special Stone.`;
  return `<div class="layout"><div class="trail-wrap">
    <svg viewBox="0 0 ${W} ${H}"><path class="trail-bg" d="${d}"/><path class="trail-done" id="trailDone" d="${d}" stroke="${p.c}" data-frac="${frac}"/><path class="trail-dash" d="${d}"/>${nodes}</svg></div>
    <div class="side">
      <div class="card"><h3>${svg('orbit','#FFB061',16)} Terraforming</h3><div class="terra" style="--c:${p.c}">${planet(p,170,missionPct(p))}<div class="pct">${missionPct(p)}%</div><small>${done} of ${n} missions</small></div></div>
      <div class="card"><h3>Special Stone</h3><div class="stonebox">${stoneIcon(p,64)}<div class="txt">${stoneTxt}</div></div></div>
    </div></div>`;
}

      <div class="box c ${custBox?'':'muted'}">Your crew<b>${t.role||'—'}</b>${t.owner==='customer'?'<div style="margin-top:4px">You own this task</div>':''}</div>
      <div class="box f ${fcBox?'':'muted'}">FC Mission Control<b>${t.fc||'FC Support (if needed)'}</b>${t.owner==='fc'?'<div style="margin-top:4px">FC owns this task</div>':''}</div>
    </div>
    <h5>Flight training</h5>
    ${t.trainings.length?t.trainings.map((x,k)=>{const key=id+'-'+k,s=S.seen.has(key);return `<div class="train ${s?'seen':''}"><div class="ty ${x.type}">${{video:'▶',article:'DOC',live:'LIVE',quiz:'QUIZ',scorm:'SCORM'}[x.type]}</div><div class="tt"><b>${x.title}</b>${x.type==='scorm'?'SCORM course':x.type[0].toUpperCase()+x.type.slice(1)} · ${x.dur}</div><button class="btn ghost" onclick="seeTraining('${key}','${id}')">${s?'✓ Done':x.type==='live'?'Register':'Start'}</button></div>`}).join(''):'<div style="color:var(--muted);font-size:13px">No training required for this maneuver.</div>'}
    ${nexts.length?`<h5>Next maneuvers</h5><div class="nexts">${nexts.map(n=>`<div class="n" onclick="openTask('${n.id}')">${S.done.has(n.id)?svg('check','#3DDC84',18,3):'<span style="width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-radius:50%;display:inline-block"></span>'}<div style="flex:1"><b>${n.title}</b></div>${ownChip(n.owner)}</div>`).join('')}</div>`:''}
  </div>
  <div class="df">
    <button class="btn ${d?'ghost':''}" onclick="toggleTask('${id}')">${d?'Mark as not done':`Complete · +${XP.task} XP`}</button>
    ${d?'':`<button class="btn blue" onclick="askHelp('${id}')" ${h?'disabled':''}>${h?'Mission Control notified':'Call Mission Control'}</button>`}
  </div>`;
  showDrawer();
}
function openMission(pid,i){
  const p=P(pid),done=S.m[pid],st=i<done?'done':i===done?'current':'locked',fin=i===p.missions.length-1,m=p.missions[i];
  const lvl=i<5?'Basic orbit':i<10?'Intermediate orbit':'Final frontier';
  const units=fin?[['Real-world challenge in your sandbox','live','45 min'],['Peer review checklist','article','10 min'],['Final assessment','quiz','15 Q']]:[['Watch: '+m,'video','8 min'],['Interactive lesson','scorm','12 min'],['Knowledge check','quiz','5 Q']];
  const D=document.getElementById('drawer');D.style.setProperty('--c',st==='locked'?'#3A4270':p.c);
  D.innerHTML=`<div class="dh"><button class="x" onclick="closeDrawer()" aria-label="Close">×</button>
    <small>${p.name} · ${lvl}${fin?'':' · Mission '+pad(i+1)}</small><h2>${m}</h2>
    <div style="margin-top:10px">${st==='done'?'<span class="own done"><span class="d"></span>Complete</span>':st==='locked'?'<span class="own" style="background:rgba(255,255,255,.1);color:#fff">Locked — finish the previous mission</span>':'<span class="own customer"><span class="d"></span>Ready for launch</span>'}</div></div>
  <div class="db">
    <p style="margin-top:0;color:#C9D2EE">${fin?`Prove mastery of ${p.name} with a real scenario. Succeed and the stone you found reveals its true form.`:`Short, practical units. Complete all three to earn +${XP.mission} XP and terraform more of the planet.`}</p>
    ${i===4&&st!=='done'?`<div class="flag" style="color:#E8D9C5;background:rgba(168,149,128,.15);border-color:rgba(168,149,128,.35)">Finishing this mission completes the Basic orbit — you will find this planet's Special Stone.</div>`:''}
    <h5>Units</h5>
    ${units.map(u=>`<div class="train ${st==='done'?'seen':''}"><div class="ty ${u[1]}">${{video:'▶',article:'DOC',live:'LAB',quiz:'QUIZ',scorm:'SCORM'}[u[1]]}</div><div class="tt"><b>${u[0]}</b>${u[2]}</div></div>`).join('')}
    <h5>Mission Control</h5>
    <div style="font-size:13px;color:var(--muted)"><b style="color:var(--ink)">Customer Success Manager</b> — book a 1:1 coaching session if you get stuck.</div>
  </div>
  <div class="df"><button class="btn" ${st!=='current'?'disabled':''} onclick="completeMission('${pid}')">${st==='done'?'Complete':fin?`Conquer the Territory · +${XP.conquer} XP`:`Complete mission · +${XP.mission} XP`}</button></div>`;
  showDrawer();
}
function showDrawer(){document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on')}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on')}

/* ================= ACTIONS ================= */
let pendingRank=null;
function addXP(n,msg){const b=rankOf(S.xp);S.xp=Math.max(0,S.xp+n);document.getElementById('xpTop').textContent=S.xp.toLocaleString();if(n>0&&msg)toast(msg,n);const a=rankOf(S.xp);if(a>b)pendingRank=a;}
function flushRank(){if(pendingRank===null)return;const r=RANKS[pendingRank];pendingRank=null;
  setTimeout(()=>{confetti(200);modal('#FF5FC8',`<div class="stage found" style="--c:#FF5FC8"><div class="rockwrap" style="display:grid;place-items:center"><img src="${FRANNIE_SRC}" style="width:150px" alt=""></div></div><div class="k">Rank up</div><h2>You are now ${r.n}</h2><p>Frannie updated your crew badge. Keep flying!</p><button class="btn" onclick="closeModal()">Onward</button>`);
    const tag=document.getElementById('rankTag');if(tag){tag.classList.remove('flip');void tag.offsetWidth;tag.classList.add('flip')}},500);}
function toggleTask(id,el){
  const {p}=findTask(id),was=setupPct(p);
  if(S.done.has(id)){S.done.delete(id);addXP(-XP.task)}else{S.done.add(id);S.help.delete(id);addXP(XP.task,'Launch task complete');burst(el)}
  const open=document.getElementById('drawer').classList.contains('on');render();if(open)openTask(id);
  if(was<100&&setupPct(p)===100){setTimeout(()=>{confetti(220);modal(p.c,`<div class="stage found" style="--c:${p.c}"><div class="rockwrap" style="display:grid;place-items:center">${planet(p,150,100).replace('data-p="100"','style="clip-path:inset(0 0 0 0)"')}</div></div><div class="k">Orbit reached</div><h2>${p.name} is live!</h2><p>Launch checklist complete. Your Mission Path is ready to explore.</p><button class="btn" onclick="closeModal();S.tab='career';render()">Start missions</button>`)},300)}
  else flushRank();
}
function askHelp(id){const {t}=findTask(id);S.help.add(id);toast(`Signal sent — your ${t.fc||'FC Support'} is on it`);render();openTask(id)}
function seeTraining(key,id){if(!S.seen.has(key)){S.seen.add(key);addXP(XP.training,'Flight training complete')}openTask(id);flushRank()}
function completeMission(pid){
  const p=P(pid),i=S.m[pid];if(i>=p.missions.length)return;
  S.m[pid]++;const c=S.m[pid];closeDrawer();
  if(c===p.missions.length){addXP(XP.conquer,'Territory conquered');render();setTimeout(()=>revealGem(p),350);}
  else if(c===p.basic.length){addXP(XP.mission,'Mission complete');addXP(XP.stone);render();confetti(80);setTimeout(()=>stoneFound(p),450);}
  else{addXP(XP.mission,'Mission complete');render();confetti(70);flushRank();}
}
function stoneFound(p){
  modal(p.c,`<div class="stage found" style="--c:${p.c}"><div class="rockwrap">${rockSVG(200)}</div></div>
   <div class="k">Basic orbit complete · +${XP.stone} XP</div><h2>You found a Special Stone</h2>
   <p>It looks like an ordinary rock… Complete the Intermediate orbit and <b>Conquer the Territory</b> to discover what ${p.name} is hiding inside.</p>
   <button class="btn" onclick="closeModal();flushRank()">Keep exploring</button>`);
}
function revealGem(p){
  modal(p.c,`<div class="stage" id="stage" style="--c:${p.g}">
     <div class="rays"></div><div class="gem">${gemSVG(p.g,180)}</div>
     <div class="rockwrap"><div class="half l">${rockSVG(200)}</div><div class="half r">${rockSVG(200)}</div>
     <svg class="cracks" width="200" height="200" viewBox="0 0 100 100" style="position:absolute;inset:0"><path d="M50 18 L45 36 L55 50 L46 66 L51 86" stroke="${p.g}" stroke-width="2.4" fill="none" style="filter:drop-shadow(0 0 4px ${p.g})"/><path d="M55 50 L70 46 M46 66 L32 70" stroke="${p.g}" stroke-width="1.6" fill="none"/></svg></div>
   </div>
   <div id="revealTxt" style="opacity:0;transition:opacity .6s"><div class="k">Territory conquered · +${XP.conquer} XP</div><h2>It was a ${p.gem}!</h2><p>${p.name} is fully terraformed. The stone revealed its true form — a gem of this planet.</p><button class="btn" onclick="closeModal();flushRank()">Claim the gem</button></div>`);
  const s=document.getElementById('stage');
  setTimeout(()=>s.classList.add('shake'),500);
  setTimeout(()=>s.classList.add('crack'),1300);
  setTimeout(()=>{s.classList.remove('shake');s.classList.add('split');confetti(260);sparkles();},2100);
  setTimeout(()=>document.getElementById('revealTxt').style.opacity=1,2600);
}
function sparkles(){const b=document.getElementById('mbox');for(let i=0;i<10;i++){const e=document.createElement('i');e.className='sparkle';e.style.left=(15+Math.random()*70)+'%';e.style.top=(8+Math.random()*40)+'%';e.style.animationDelay=(Math.random()*1.4)+'s';b.appendChild(e)}}
function modal(c,html){const m=document.getElementById('mbox');m.style.setProperty('--c',c);m.innerHTML=html;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}

/* ================= FX ================= */
let tt;function toast(msg,xp){const t=document.getElementById('toast');t.innerHTML=`${xp?`<span class="xp">+${xp} XP</span>`:svg('radio','#7FD8F7',18)}<span>${msg}</span>`;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function fitC(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',fitC);fitC();
function confetti(n,ox,oy){const cols=['#E07300','#FF5FC8','#4CC9F0','#FFB061','#9B5DE5','#3DDC84','#fff'];for(let i=0;i<n;i++)parts.push({x:ox??innerWidth/2,y:oy??innerHeight*.4,vx:(Math.random()-.5)*(ox?8:16),vy:Math.random()*-12-(ox?2:4),s:Math.random()*6+3,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],life:ox?60:150,star:Math.random()<.35});if(!raf)loopC()}
function loopC(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);parts.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);if(p.star){cx.beginPath();cx.arc(0,0,p.s/2.4,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=parts.length?requestAnimationFrame(loopC):null;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
function burst(el){if(!el)return confetti(40);const b=el.getBoundingClientRect();confetti(34,b.left+b.width/2,b.top+b.height/2)}

/* starfield */
const sc=document.getElementById('stars'),sx=sc.getContext('2d');let stars=[],shoot=null;
function fitS(){sc.width=innerWidth*devicePixelRatio;sc.height=innerHeight*devicePixelRatio;stars=Array.from({length:Math.round(innerWidth*innerHeight/5000)},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:(Math.random()*.9+.25)*devicePixelRatio,p:Math.random()*6.3,v:Math.random()*.02+.005}))}
addEventListener('resize',fitS);fitS();
(function drawS(){sx.clearRect(0,0,sc.width,sc.height);stars.forEach(s=>{s.p+=s.v;sx.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));sx.fillStyle='#fff';sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});
  if(!shoot&&Math.random()<.004)shoot={x:Math.random()*sc.width*.7,y:Math.random()*sc.height*.4,l:0};
  if(shoot){shoot.l+=14*devicePixelRatio;const g=sx.createLinearGradient(shoot.x+shoot.l,shoot.y+shoot.l*.4,shoot.x+shoot.l-120,shoot.y+shoot.l*.4-48);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');sx.globalAlpha=1;sx.strokeStyle=g;sx.lineWidth=2;sx.beginPath();sx.moveTo(shoot.x+shoot.l,shoot.y+shoot.l*.4);sx.lineTo(shoot.x+shoot.l-120,shoot.y+shoot.l*.4-48);sx.stroke();if(shoot.l>sc.width*.5)shoot=null}
  requestAnimationFrame(drawS)})();

/* rocket smoke */
let smokeT=null;
function startSmoke(){clearInterval(smokeT);const track=document.getElementById('track');if(!track)return;
  const t0=performance.now();
  smokeT=setInterval(()=>{const tr=document.getElementById('track'),rk=document.getElementById('rocket');if(!tr||!rk){clearInterval(smokeT);return}
    const moving=performance.now()-t0<2600;if(!moving&&Math.random()<.55)return;
    const x=rk.offsetLeft-14,e=document.createElement('i');e.className='puff';
    e.style.left=x+'px';e.style.top=(22-8+Math.random()*6-3)+'px';
    e.style.setProperty('--dx',(-40-Math.random()*70)+'px');e.style.setProperty('--dy',(Math.random()*30-15)+'px');
    tr.appendChild(e);setTimeout(()=>e.remove(),1800)},90);
}

function animateIn(){
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('.pf[data-p]').forEach(e=>e.style.clipPath=`inset(${100-e.dataset.p}% 0 0 0)`);
    document.querySelectorAll('.atm[data-o]').forEach(e=>e.style.setProperty('--o',e.dataset.o));
    document.querySelectorAll('.bar i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');
    const fl=document.getElementById('flame'),rk=document.getElementById('rocket');
    if(fl&&rk){fl.style.width=`calc(${fl.dataset.w}% - 4px)`;rk.style.left=`calc(${rk.dataset.l}% - 4px)`;startSmoke()}
    const td=document.getElementById('trailDone');if(td){const L=td.getTotalLength();td.style.strokeDasharray=L;td.style.strokeDashoffset=L;td.getBoundingClientRect();td.style.strokeDashoffset=L*(1-td.dataset.frac)}
    document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)});
  },60));
}

/* ================= ROUTING / SEARCH ================= */
function go(v,pid){S.view=v;if(pid){S.pid=pid;S.tab='setup'}closeDrawer();render();scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('app').innerHTML=S.view==='home'?home():path();document.getElementById('xpTop').textContent=S.xp.toLocaleString();animateIn()}
const esc=s=>s.replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
function search(q){
  q=q.trim().toLowerCase();if(!q){render();return}
  const hits=[];PRODUCTS.forEach(p=>{if(p.name.toLowerCase().includes(q))hits.push({k:'Planet',l:p.name,a:`go('path','${p.id}')`});
    allTasks(p).forEach(t=>{if((t.title+' '+t.trainings.map(x=>x.title).join(' ')).toLowerCase().includes(q))hits.push({k:p.name+' · Launch',l:t.title,a:`go('path','${p.id}');openTask('${t.id}')`})});
    p.missions.forEach((m,i)=>{if(m.toLowerCase().includes(q))hits.push({k:p.name+' · Mission',l:m,a:`S.pid='${p.id}';S.view='path';S.tab='career';render();openMission('${p.id}',${i})`})})});
  document.getElementById('app').innerHTML=`<div class="section-h"><div><h2>Scan results for “${esc(q)}”</h2><p>${hits.length} found</p></div></div><div class="card">${hits.length?hits.map(h=>`<div class="kv" style="cursor:pointer;padding:11px 0" onclick="${h.a}"><b>${esc(h.l)}</b><span style="color:var(--muted)">${esc(h.k)}</span></div>`).join(''):'Nothing in this sector.'}</div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
render();
</script>
</body>
